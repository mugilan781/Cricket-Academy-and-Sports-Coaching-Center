<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your EliteStrike Cricket Academy account and start your cricket journey with our elite training programs." />
  <title>Join EliteStrike — Cricket Academy Signup</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="icon" type="image/png" href="images/logo.png" />
</head>
<body>
<div id="pageTransition" class="page-transition active"><div class="page-transition-logo"><img class="pt-logo-img" src="images/logo.png" alt="EliteStrike" /> EliteStrike</div></div>

<div class="login-page">
  <div class="login-card signup-card">

    <!-- Brand -->
    <a href="index.html" class="login-brand" aria-label="EliteStrike Cricket Academy home">
      <span class="login-brand-mark"><img src="images/logo.png" alt="EliteStrike" /></span>
      <span class="login-brand-text">
        <span class="login-brand-name">EliteStrike</span>
        <span class="login-brand-tagline">Cricket Academy</span>
      </span>
    </a>

    <!-- Heading -->
    <h1 class="login-title">Create Account</h1>
    <p class="login-subtitle">Join EliteStrike and start your cricket journey</p>

    <!-- Form -->
    <form id="signupForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="signupName">Full Name</label>
        <input type="text" id="signupName" class="form-control" placeholder="Student's full name" required minlength="2" autocomplete="name" />
        <div id="signupNameError" class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" class="form-control" placeholder="student@example.com" required autocomplete="email" />
        <div id="signupEmailError" class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signupPhone">Phone Number</label>
        <input type="tel" id="signupPhone" class="form-control" placeholder="+91 98765 43210" required autocomplete="tel" />
        <div id="signupPhoneError" class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signupPassword">Password</label>
        <div class="pwd-wrap">
          <input type="password" id="signupPassword" class="form-control" placeholder="Create a strong password" required minlength="6" autocomplete="new-password" />
          <button type="button" class="pwd-toggle" aria-label="Show password" onclick="togglePwd('signupPassword', this)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div id="signupPasswordError" class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signupConfirm">Confirm Password</label>
        <div class="pwd-wrap">
          <input type="password" id="signupConfirm" class="form-control" placeholder="Re-enter your password" required autocomplete="new-password" />
          <button type="button" class="pwd-toggle" aria-label="Show password" onclick="togglePwd('signupConfirm', this)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div id="signupConfirmError" class="form-error"></div>
      </div>

      <div class="signup-terms">
        <label class="checkbox-label">
          <input type="checkbox" id="signupTerms" required />
          <span>I agree to the <a href="terms.html">Terms &amp; Conditions</a> and <a href="privacy-policy.html">Privacy Policy</a></span>
        </label>
        <div id="signupTermsError" class="form-error"></div>
      </div>

      <button type="submit" class="login-submit">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="auth-divider">or sign up with</div>

    <!-- Social signup -->
    <div class="login-social">
      <a href="https://www.google.com/" class="login-social-btn" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg> Google
      </a>
      <a href="https://www.facebook.com/" class="login-social-btn" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg> Facebook
      </a>
    </div>

    <!-- Login redirect -->
    <p class="login-signup">Already have an account? <a href="login.html">Sign In</a></p>

  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="js/main.js"></script>
<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.innerHTML = input.type === 'password' ? '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>' : '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61M2 2l20 20"/></svg>';
}

(function() {
  const form = document.getElementById('signupForm');
  const password = document.getElementById('signupPassword');
  const confirm = document.getElementById('signupConfirm');
  const terms = document.getElementById('signupTerms');
  const termsError = document.getElementById('signupTermsError');

  function setFieldError(input, message) {
    const errEl = document.getElementById(input.id + 'Error');
    input.classList.toggle('error', !!message);
    if (errEl) {
      errEl.textContent = message || '';
      errEl.classList.toggle('show', !!message);
    }
  }

  function validateField(input) {
    const value = input.value.trim();
    let message = '';
    if (input.required && !value) {
      message = 'This field is required.';
    } else if (input.type === 'email' && value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
      message = 'Please enter a valid email address.';
    } else if (input.type === 'tel' && value && !/^[\+]?[\d\s\-\(\)]{8,15}$/.test(value)) {
      message = 'Please enter a valid phone number.';
    } else if (input.minLength > 0 && value.length < input.minLength) {
      message = 'Minimum ' + input.minLength + ' characters required.';
    }
    setFieldError(input, message);
    return !message;
  }

  function checkMatch() {
    let message = '';
    if (confirm.value && confirm.value !== password.value) {
      message = 'Passwords do not match.';
    }
    setFieldError(confirm, message);
    return !message;
  }

  form.querySelectorAll('input').forEach(function(input) {
    if (input.type === 'checkbox') return;
    input.addEventListener('blur', function() {
      validateField(input);
      if (input === confirm || input === password) checkMatch();
    });
    input.addEventListener('input', function() {
      if (input.classList.contains('error')) validateField(input);
      if ((input === confirm || input === password) && confirm.value) checkMatch();
    });
  });

  terms.addEventListener('change', function() {
    if (terms.checked) {
      termsError.textContent = '';
      termsError.classList.remove('show');
      terms.classList.remove('error');
    }
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    let valid = true;

    form.querySelectorAll('input').forEach(function(input) {
      if (input.type === 'checkbox') return;
      if (!validateField(input)) valid = false;
    });
    if (!checkMatch()) valid = false;

    if (!terms.checked) {
      termsError.textContent = 'You must accept the Terms & Conditions and Privacy Policy to continue.';
      termsError.classList.add('show');
      terms.classList.add('error');
      valid = false;
    }

    if (!valid) {
      showToast('Please fix the errors and try again.', 'error');
      return;
    }

    showToast('<svg class="ic ic-fill" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/><path d="M5 15l.9 2.1L8 18l-2.1.9L5 21l-.9-2.1L2 18l2.1-.9z"/></svg> Account created! Welcome to EliteStrike.', 'success', 6000);
    setTimeout(() => window.location.href = 'login.html', 2000);
  });
})();
</script>
</body>
</html>
