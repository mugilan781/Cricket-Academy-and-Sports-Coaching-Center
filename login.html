<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your EliteStrike Cricket Academy student dashboard to access your schedule, training data and more." />
  <title>Student Login — EliteStrike Cricket Academy</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="icon" type="image/png" href="images/logo.png" />
</head>
<body>
<div id="pageTransition" class="page-transition active"><div class="page-transition-logo"><img class="pt-logo-img" src="images/logo.png" alt="EliteStrike" /> EliteStrike</div></div>

<div class="login-page">
  <div class="login-card">

    <!-- Brand -->
    <a href="index.html" class="login-brand" aria-label="EliteStrike Cricket Academy home">
      <span class="login-brand-mark"><img src="images/logo.png" alt="EliteStrike" /></span>
      <span class="login-brand-text">
        <span class="login-brand-name">EliteStrike</span>
        <span class="login-brand-tagline">Cricket Academy</span>
      </span>
    </a>

    <!-- Heading -->
    <h1 class="login-title">Welcome Back</h1>
    <p class="login-subtitle">Sign in to your student dashboard</p>

    <!-- Form -->
    <form data-validate id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="student@example.com" required autocomplete="email" />
        <div id="loginEmailError" class="form-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="pwd-wrap">
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required minlength="6" autocomplete="current-password" />
          <button type="button" class="pwd-toggle" aria-label="Show password" onclick="togglePwd('loginPassword', this)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div id="loginPasswordError" class="form-error"></div>
      </div>

      <div class="remember-row">
        <label class="checkbox-label">
          <input type="checkbox" /> Remember me
        </label>
        <a href="#" class="forgot-link" onclick="showToast('Password reset link sent to your email!', 'success')">Forgot password?</a>
      </div>

      <button type="submit" class="login-submit">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Sign In
      </button>
    </form>

    <!-- Divider -->
    <div class="auth-divider">or continue with</div>

    <!-- Social login -->
    <div class="login-social">
      <a href="https://www.google.com/" class="login-social-btn" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg> Google
      </a>
      <a href="https://www.facebook.com/" class="login-social-btn" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg> Facebook
      </a>
    </div>

    <!-- Signup redirect -->
    <p class="login-signup">Don't have an account? <a href="signup.html">Sign Up</a></p>

  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="js/main.js"></script>
<script>
function togglePwd(id, btn) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.innerHTML = input.type === 'password' ? '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>' : '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61M2 2l20 20"/></svg>';
}
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  showToast('Signing in...', 'info');
  setTimeout(() => window.location.href = 'dashboard.html', 1000);
});
</script>
</body>
</html>
